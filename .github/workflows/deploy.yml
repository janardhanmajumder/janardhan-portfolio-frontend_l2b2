name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"] # Or your default branch
  schedule:
    - cron: "0 0 * * *" # Daily automatic rebuild & deploy to GitHub Pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || 'yarn' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci;
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
          else npm install;
          fi

      - name: Build and Export
        run: npm run build # NextJS extracts assets into the /out folder automatically

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Instructs GitHub to grab the extracted static folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4